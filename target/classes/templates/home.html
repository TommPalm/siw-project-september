<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<head>
		<title>Home</title>
		<link rel="stylesheet" th:href="@{/css/style.css}"/>
	</head>
	<body>
		<div class="titolo">
			<img id="sfondo" th:src="@{/images/cinema.jpg}" />
			<strong id="nome">🎬FESTIVAL DEL CINEMA🍿</strong>
			<a id="login" th:href="@{/login}">Accedi</a>
			<a id="register" th:href="@{/register}">Registrati</a>
		</div>
		
		<p th:if="${#lists.isEmpty(festivals)}">Spiacenti, non ci sono festivals</p>
		
		<ul>
			<li th:each="festival : ${festivals}">
				<span th:text="${festival.name}"></span>
				<div>
					<h1> dal </h1>
					<span th:text="${festival.startingDate}"></span>
					<h1> al </h1>
					<span th:text="${festival.endingDate}"></span>
					<span th:text="${festival.year}"></span>
					<h1> a </h1>
					<span th:text="${festival.city}"></span>
				</div>
				<span th:text="${festival.description}"></span>
				<a th:href="@{/festival/{id}/info(id=${festival.id})}">scopri di più</a>
			</li>
		</ul>
	</body>
</html>
