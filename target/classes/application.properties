spring.application.name=siw-settembre

#==================================​

# = Datasource​

#==================================​

spring.jpa.database=POSTGRESQL

spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=debug

logging.level.org.hibernate.type.descriptor.sql=trace

#======create to only use data.sql info, update per mantenere dati aggiunti in esecuzione

spring.jpa.hibernate.ddl-auto=create

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.url=jdbc:postgresql://localhost:5432/SIWSETT

spring.datasource.username=postgres

spring.datasource.password=Never003!

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.jpa.defer-datasource-initialization=true

#=== always  ripopola ogni volta il db con i dati di .sql ==== never invece ricorda i dati inseriti in precedenti 
# esecuzioni, ma ignora i dati iniziali di .sql
spring.sql.init.mode=always



#==================================​

# = Web server​

#==================================​

server.port=8080
#server.port=5432

#==================================​

# = Thymeleaf configurations​

#==================================​

spring.thymeleaf.check-template-location=true

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

spring.thymeleaf.servlet.content-type=text/html

spring.thymeleaf.cache=false

spring.thymeleaf.encoding=UTF-8