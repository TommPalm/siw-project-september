<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Modifica Proiezione</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body>

<div class="admin-page">

    <div class="admin-header">
        <h1>🎞️ Modifica proiezione</h1>
        <p>Modifica data, orario, film, festival e sala</p>
    </div>

    <form class="admin-form"
          th:action="@{/proiezione/mod}"
          th:object="${proiezione}"
          method="POST">

        <input type="hidden" th:field="*{id}">


        <!-- DATA -->
        <div class="admin-form-group">

            <label for="date">
                📅 Data
            </label>

            <input
                id="date"
                class="admin-input"
                type="text"
                required
                th:field="*{date}"
                placeholder="Es. 15 settembre"
            />

        </div>


        <!-- ORA -->
        <div class="admin-form-group">

            <label for="time">
                🕐 Ora
            </label>

            <input
                id="time"
                class="admin-input"
                type="text"
                required
                th:field="*{time}"
                placeholder="HH:mm"
            />

        </div>


        <!-- STATO -->
        <div class="admin-form-group">

            <label for="state">
                Stato
            </label>

            <select
                id="state"
                class="admin-select"
                th:field="*{state}"
                required>

                <option value="">-- Seleziona lo stato --</option>

                <option value="SCHEDULED">
                    SCHEDULED
                </option>

                <option value="CANCELLED">
                    CANCELLED
                </option>

                <option value="COMPLETED">
                    COMPLETED
                </option>

            </select>

        </div>


        <!-- FESTIVAL -->
        <div class="admin-form-group">

            <label for="festivalId">
                🎪 Festival
            </label>

            <select
                id="festivalId"
                class="admin-select"
                name="festivalId"
                required>

                <option value="">
                    -- Seleziona un festival --
                </option>

                <option
                    th:each="festival : ${festivals}"
                    th:value="${festival.id}"
                    th:text="${festival.name}"
                    th:selected="${proiezione.festival != null and festival.id == proiezione.festival.id}">
                </option>

            </select>

        </div>


        <!-- FILM -->
        <div class="admin-form-group">

            <label for="filmId">
                🎬 Film
            </label>

            <select
                id="filmId"
                class="admin-select"
                name="filmId"
                required>

                <option value="">
                    -- Seleziona un film --
                </option>

                <option
                    th:each="film : ${films}"
                    th:value="${film.id}"
                    th:text="${film.title}"
                    th:selected="${proiezione.film != null and film.id == proiezione.film.id}">
                </option>

            </select>

        </div>


        <!-- SALA -->
        <div class="admin-form-group">

            <label for="roomId">
                🏛️ Sala
            </label>

            <select
                id="roomId"
                class="admin-select"
                name="roomId"
                required>

                <option value="">
                    -- Seleziona una sala --
                </option>

                <option
                    th:each="sala : ${sale}"
                    th:value="${sala.id}"
                    th:text="${sala.name}"
                    th:selected="${proiezione.room != null and sala.id == proiezione.room.id}">
                </option>

            </select>

        </div>


        <!-- SUBMIT -->
        <button type="submit" class="admin-submit">
            💾 Salva modifiche
        </button>

    </form>


    <a class="admin-back" th:href="@{/admin/gestione}">
        ← Torna alla gestione
    </a>

</div>

</body>
</html>
