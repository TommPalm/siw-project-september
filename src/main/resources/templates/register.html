<!DOCTYPE html>
<html lang="it"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrazione</title>

    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>

<body class="auth-page">

    <!-- =========================
         HEADER
         ========================= -->

    <header class="auth-header">

        <div class="auth-logo">
            🎬
        </div>

        <h1>
            Crea il tuo account
        </h1>

        <p>
            Entra a far parte della community del festival
        </p>

    </header>


    <!-- =========================
         GENERAL ERROR
         ========================= -->

    <p
        th:if="${error}"
        th:text="${error}"
        class="auth-error">
    </p>


    <!-- =========================
         REGISTER CARD
         ========================= -->

    <main class="auth-card">

        <h2 class="auth-card-title">
            Registrazione
        </h2>

        <p class="auth-card-subtitle">
            Compila i campi per creare il tuo account.
        </p>


        <form class="auth-form"
              th:action="@{/register}"
              method="POST">

            <!-- NAME -->

            <div class="form-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    id="nome"
                    class="auth-input"
                    type="text"
                    required
                    th:field="${user.nome}"
                    placeholder="Inserisci il tuo nome"
                />

                <span
                    th:if="${#fields.hasErrors('user.nome')}"
                    th:errors="${user.nome}"
                    class="field-error">
                </span>

            </div>


            <!-- SURNAME -->

            <div class="form-group">

                <label for="surname">
                    Cognome
                </label>

                <input
                    id="surname"
                    class="auth-input"
                    type="text"
                    required
                    th:field="${user.surname}"
                    placeholder="Inserisci il tuo cognome"
                />

                <span
                    th:if="${#fields.hasErrors('user.surname')}"
                    th:errors="${user.surname}"
                    class="field-error">
                </span>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    class="auth-input"
                    type="text"
                    required
                    th:field="${credenziali.username}"
                    placeholder="Scegli un username"
                    autocomplete="username"
                />

                <span
                    th:if="${#fields.hasErrors('credenziali.username')}"
                    th:errors="${credenziali.username}"
                    class="field-error">
                </span>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    class="auth-input"
                    type="password"
                    required
                    th:field="${credenziali.password}"
                    placeholder="Scegli una password"
                    autocomplete="new-password"
                />

                <span
                    th:if="${#fields.hasErrors('credenziali.password')}"
                    th:errors="${credenziali.password}"
                    class="field-error">
                </span>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="auth-button">

                Crea account

            </button>

        </form>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer class="auth-footer">

        <p>
            Hai già un account?

            <a th:href="@{/login}">
                Login
            </a>
        </p>

        <p>
            <a class="auth-home-link"
               th:href="@{/}">
                ← Torna alla home
            </a>
        </p>

    </footer>

</body>
</html>
